name: CI

on:
    push:
    pull_request:

env:
    REGISTRY: ghcr.io
    BACKEND_IMAGE_NAME: ${{ github.repository }}-backend
    FRONTEND_IMAGE_NAME: ${{ github.repository }}-frontend

jobs:
    backend:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                python-version: '3.12'

            - name: Install backend dependencies
              working-directory: backend
              run: pip install -r requirements.txt

            - name: Run Django checks
              working-directory: backend
              run: python manage.py check

            - name: Run backend tests
              working-directory: backend
              run: python manage.py test

    frontend:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                node-version: '24'
                cache: npm
                cache-dependency-path: frontend/package-lock.json

            - name: Install frontend dependencies
              working-directory: frontend
              run: npm ci

            - name: Run frontend lint
              working-directory: frontend
              run: npm run lint

            - name: Build frontend
              working-directory: frontend
              run: npm run build

    docker:
        runs-on: ubuntu-latest
        needs:
            - backend
            - frontend
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Log in to GitHub Container Registry
              if: github.event_name == 'push'
              uses: docker/login-action@v4
              with:
                registry: ${{ env.REGISTRY }}
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build backend Docker image
              run: |
                docker build \
                  -t ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest \
                  -t ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }} \
                  ./backend

            - name: Build frontend Docker image
              run: |
                docker build \
                  -t ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest \
                  -t ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }} \
                  ./frontend
            - name: Push backend Docker image
              if: github.event_name == 'push'
              run: docker push --all-tags ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}

            - name: Push frontend Docker image
              if: github.event_name == 'push'
              run: docker push --all-tags ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
